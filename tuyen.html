<style>

body{
    margin:0;
    background:#f4f8fd;
    font-family:Arial,sans-serif;
    color:#123b7a;
}

.route-page{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 60px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#0750a5;
    font-weight:bold;
    text-decoration:none;
}

.route-title{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px #0001;
    margin-bottom:15px;
}

.route-title h1{
    margin:0 0 10px;
    color:#0750a5;
    font-size:30px;
}

.route-title p{
    margin:0;
    color:#666;
}

.notice{
    background:#fff8e7;
    border-left:4px solid #f58218;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    color:#555;
}

.company{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 3px 15px #0001;
}

.company-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
}

.company h2{
    margin:0 0 10px;
    font-size:20px;
    color:#123b7a;
}

.company p{
    margin:6px 0;
    color:#666;
}

.time{
    color:#0750a5!important;
    font-weight:bold;
}

.price{
    color:#f47700;
    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
}

.book{
    display:inline-block;
    margin-top:12px;
    padding:12px 18px;
    background:#0750a5;
    color:white;
    border:0;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.book:hover{
    background:#063b80;
}

.booking{
    display:none;
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #ddd;
}

.booking.show{
    display:block;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.form-grid label{
    font-size:13px;
    font-weight:bold;
    color:#333;
}

.form-grid input,
.form-grid select{
    width:100%;
    padding:12px;
    margin-top:6px;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:7px;
    background:white;
}

.zalo{
    margin-top:15px;
    padding:13px 20px;
    background:#f58218;
    color:white;
    border:0;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.empty{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

@media(max-width:700px){

    .route-title h1{
        font-size:24px;
    }

    .company-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>
