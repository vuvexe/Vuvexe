    .booking{

function escapeHtml(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function getParams(){
  var params = new URLSearchParams(window.location.search);
  return {
    from: params.get("from") || "",
    to: params.get("to") || ""
  };
}

function openBooking(index){
  var box = document.getElementById("booking-" + index);
  if(box){
    box.classList.toggle("open");
    if(box.classList.contains("open")){
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }
  }
}

function sendZalo(index){
  var company = document.getElementById("company-" + index).value;
  var from = document.getElementById("from").value;
  var to = document.getElementById("to").value;
  var date = document.getElementById("date-" + index).value;
  var time = document.getElementById("time-" + index).value;
  var guests = document.getElementById("guests-" + index).value;
  var name = document.getElementById("name-" + index).value.trim();
  var phone = document.getElementById("phone-" + index).value.trim();

  if(!date || !name || !phone){
    alert("Vui lòng nhập ngày đi, họ tên và số điện thoại.");
    return;
  }

  var message =
    "VŨ VÉ XE - YÊU CẦU ĐẶT VÉ\n\n" +
    "Nhà xe: " + company + "\n" +
    "Tuyến: " + from + " → " + to + "\n" +
    "Ngày đi: " + date + "\n" +
    "Giờ mong muốn: " + (time || "Chưa chọn") + "\n" +
    "Số khách: " + guests + "\n" +
    "Họ tên: " + name + "\n" +
    "Số điện thoại: " + phone + "\n\n" +
    "Nhờ Vũ Vé Xe kiểm tra chỗ và báo giá giúp mình.";

  window.location.href =
    "https://zalo.me/0386003098?text=" + encodeURIComponent(message);
}

function renderPage(){
  var content = document.getElementById("routeContent");
  var p = getParams();
  var key = p.from + "|" + p.to;
  var list = ROUTES[key];

  if(!p.from || !p.to){
    content.innerHTML =
      '<div class="empty"><h2>Chưa chọn tuyến</h2>' +
      '<p>Vui lòng quay lại trang chủ và chọn tuyến cần đi.</p>' +
      '<a class="back" href="index.html">← Về trang chủ</a></div>';
    return;
  }

  if(!list){
    content.innerHTML =
      '<div class="route-head">' +
      '<h1>' + escapeHtml(p.from) + ' → ' + escapeHtml(p.to) + '</h1>' +
      '<p>VŨ VÉ XE hỗ trợ tìm nhà xe phù hợp cho bạn.</p>' +
      '</div>' +
      '<div class="notice">Tuyến này chưa có danh sách nhà xe trên website. Bạn vẫn có thể liên hệ Zalo để Vũ Vé Xe kiểm tra vé.</div>' +
      '<a class="send" style="display:block;text-align:center;text-decoration:none" href="https://zalo.me/0386003098?text=' +
      encodeURIComponent("VŨ VÉ XE - YÊU CẦU TÌM VÉ\n\nTuyến: " + p.from + " → " + p.to) +
      '">📲 GỬI YÊU CẦU QUA ZALO</a>';
    return;
  }

  var html =
    '<div class="route-head">' +
    '<h1>' + escapeHtml(p.from) + ' → ' + escapeHtml(p.to) + '</h1>' +
    '<p>Chọn nhà xe, nhập thông tin và bấm <b>Gửi yêu cầu qua Zalo</b>.</p>' +
    '</div>' +
    '<div class="notice">📌 Giá vé và chỗ có thể thay đổi theo ngày. Vũ Vé Xe sẽ kiểm tra lại trước khi xác nhận.</div>' +
    '<input type="hidden" id="from" value="' + escapeHtml(p.from) + '">' +
    '<input type="hidden" id="to" value="' + escapeHtml(p.to) + '">';

  for(var i=0;i<list.length;i++){
    var c=list[i];
    var times=c[1].split("·");
    var options='<option value="">Chọn giờ</option>';
    for(var j=0;j<times.length;j++){
      options += '<option value="' + escapeHtml(times[j].trim()) + '">' + escapeHtml(times[j].trim()) + '</option>';
    }

    html +=
      '<article class="company">' +
      '<div class="company-top">' +
      '<div>' +
      '<h2>🚍 ' + escapeHtml(c[0]) + '</h2>' +
      '<p class="schedule">🕐 Khởi hành: ' + escapeHtml(c[1]) + '</p>' +
      '<p>🚌 ' + escapeHtml(c[2]) + '</p>' +
      '</div>' +
      '<div class="price">' + escapeHtml(c[3]) + '</div>' +
      '</div>' +
      '<button class="book-btn" onclick="openBooking(' + i + ')">ĐẶT VÉ NHÀ XE NÀY</button>' +
      '<div class="booking" id="booking-' + i + '">' +
      '<input type="hidden" id="company-' + i + '" value="' + escapeHtml(c[0]) + '">' +
      '<div class="grid">' +
      '<label>Ngày đi<input type="date" id="date-' + i + '"></label>' +
      '<label>Giờ mong muốn<select id="time-' + i + '">' + options + '</select></label>' +
      '<label>Số khách<select id="guests-' + i + '">' +
      '<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>' +
      '<option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>' +
      '</select></label>' +
      '<label>Họ và tên<input type="text" id="name-' + i + '" placeholder="Nguyễn Văn A"></label>' +
      '<label>Số điện thoại<input type="tel" id="phone-' + i + '" placeholder="09xxxxxxxx"></label>' +
      '</div>' +
      '<button class="send" onclick="sendZalo(' + i + ')">📲 GỬI YÊU CẦU QUA ZALO</button>' +
      '</div>' +
      '</article>';
  }

  content.innerHTML = html;

  var today = new Date().toISOString().split("T")[0];
  for(var k=0;k<list.length;k++){
    var dateInput=document.getElementById("date-"+k);
    if(dateInput) dateInput.min=today;
  }
}

window.onload = renderPage;
